# Servidor
server.port=8080

# Banco de dados MySQL (vers\u00e3o compat\u00edvel com Hibernate 7.x)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_biblioteca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (usando dialect padr\u00e3o do Hibernate 7)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Para evitar problemas de vers\u00e3o
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

spring.web.resources.static-locations=classpath:/static/

# JWT Configuration
jwt.secret = chaveSecretaSuperSeguraParaBiblioteca2026
jwt.expiration = 86400000