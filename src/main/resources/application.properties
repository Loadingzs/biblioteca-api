server.port=${PORT:8080}

# Fonte única para o DataSource compartilhado pelos três repositórios.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_biblioteca}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# Sem chave padrão: a inicialização exige uma chave própria.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Criação explícita de uma nova conta administrativa; desativada por padrão.
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

server.error.include-message=never
