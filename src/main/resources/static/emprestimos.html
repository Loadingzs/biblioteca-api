<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Empréstimos | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-return {
            background: #28a745;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .filtros {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .filtros button {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .filtros button.ativo {
            background: #2d6a4f;
            color: white;
            border-color: #2d6a4f;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-content select, .modal-content input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .btn-save {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html">Livros</a>
            <a href="usuarios.html">Usuários</a>
            <a href="emprestimos.html" style="background: rgba(255,255,255,0.2);">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>🔄 Gerenciamento de Empréstimos</h2>
            <button class="btn-primary" onclick="abrirModalEmprestimo()">+ Novo Empréstimo</button>
        </div>
        
        <div class="filtros">
            <button class="ativo" onclick="filtrarEmprestimos('todos')">Todos</button>
            <button onclick="filtrarEmprestimos('ATIVO')">Ativos</button>
            <button onclick="filtrarEmprestimos('ATRASADO')">Atrasados</button>
            <button onclick="filtrarEmprestimos('FINALIZADO')">Finalizados</button>
        </div>
        
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>Livro</th>
                        <th>Data Empréstimo</th>
                        <th>Data Prevista</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaEmprestimos">
                    <!-- Dados preenchidos pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
    
    <div id="modalEmprestimo" class="modal">
        <div class="modal-content">
            <h3>🔄 Novo Empréstimo</h3>
            <select id="selectUsuario">
                <option value="">Selecione um usuário</option>
            </select>
            <select id="selectLivro">
                <option value="">Selecione um livro</option>
            </select>
            <input type="date" id="dataPrevista">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModalEmprestimo()">Cancelar</button>
                <button class="btn-save" onclick="realizarEmprestimo()">Registrar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        let emprestimos = [];
        let livros = [];
        let usuarios = [];
        let filtroAtual = 'todos';
        const API_URL = '/api';

        async function carregarDados() {
            try {
                const [resLivros, resUsuarios, resEmprestimos] = await Promise.all([
                    fetch(`${API_URL}/livros`),
                    fetch(`${API_URL}/usuarios`),
                    fetch(`${API_URL}/emprestimos`)
                ]);
                livros = await resLivros.json();
                usuarios = await resUsuarios.json();
                emprestimos = await resEmprestimos.json();
                renderizarTabelaEmprestimos();
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao carregar dados');
            }
        }

        function renderizarTabelaEmprestimos() {
            const tbody = document.getElementById('tabelaEmprestimos');
            tbody.innerHTML = '';
            
            let filtrados = emprestimos;
            if (filtroAtual !== 'todos') {
                filtrados = emprestimos.filter(e => e.status === filtroAtual);
            }
            
            filtrados.forEach(emp => {
                const usuario = usuarios.find(u => u.id === emp.usuarioId);
                const livro = livros.find(l => l.id === emp.livroId);
                
                let statusClass = '';
                if (emp.status === 'ATIVO') statusClass = 'status-ativo';
                else if (emp.status === 'ATRASADO') statusClass = 'status-atrasado';
                else statusClass = 'status-devolvido';
                
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${emp.id}</td>
                    <td>${usuario?.nome || 'N/A'}</td>
                    <td>${livro?.titulo || 'N/A'}</td>
                    <td>${emp.dataEmprestimo || '-'}</td>
                    <td>${emp.dataDevolucaoPrevista || '-'}</td>
                    <td class="${statusClass}">${emp.status || '-'}</td>
                    <td>
                        ${emp.status !== 'FINALIZADO' ? `<button class="btn-return" onclick="registrarDevolucao(${emp.id})">📖 Devolver</button>` : '—'}
                    </td>
                `;
            });
        }

        function filtrarEmprestimos(filtro) {
            filtroAtual = filtro;
            document.querySelectorAll('.filtros button').forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');
            renderizarTabelaEmprestimos();
        }

        async function abrirModalEmprestimo() {
            const selectUsuario = document.getElementById('selectUsuario');
            const selectLivro = document.getElementById('selectLivro');
            
            selectUsuario.innerHTML = '<option value="">Selecione um usuário</option>';
            selectLivro.innerHTML = '<option value="">Selecione um livro</option>';
            
            usuarios.forEach(u => {
                selectUsuario.innerHTML += `<option value="${u.id}">${u.nome}</option>`;
            });
            
            const livrosDisponiveis = livros.filter(l => l.disponivel === true);
            livrosDisponiveis.forEach(l => {
                selectLivro.innerHTML += `<option value="${l.id}">${l.titulo}</option>`;
            });
            
            document.getElementById('dataPrevista').value = '';
            document.getElementById('modalEmprestimo').style.display = 'flex';
        }

        async function realizarEmprestimo() {
            const usuarioId = parseInt(document.getElementById('selectUsuario').value);
            const livroId = parseInt(document.getElementById('selectLivro').value);
            const dataPrevista = document.getElementById('dataPrevista').value;
            
            if (!usuarioId || !livroId || !dataPrevista) {
                alert('❌ Preencha todos os campos!');
                return;
            }
            
            const hoje = new Date();
            const dataPrevistaDate = new Date(dataPrevista);
            const diasDiferenca = Math.ceil((dataPrevistaDate - hoje) / (1000 * 60 * 60 * 24));
            
            try {
                const response = await fetch(`${API_URL}/emprestimos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        livroId: livroId,
                        usuarioId: usuarioId,
                        dias: diasDiferenca
                    })
                });
                
                if (response.ok) {
                    alert('✅ Empréstimo realizado!');
                    fecharModalEmprestimo();
                    carregarDados();
                } else {
                    alert('❌ Erro ao realizar empréstimo');
                }
            } catch (error) {
                alert('❌ Erro de conexão');
            }
        }

        async function registrarDevolucao(id) {
            if (confirm('📖 Registrar devolução deste empréstimo?')) {
                try {
                    const response = await fetch(`${API_URL}/emprestimos/devolucao/${id}`, {
                        method: 'PUT'
                    });
                    
                    if (response.ok) {
                        alert('✅ Devolução registrada!');
                        carregarDados();
                    } else {
                        alert('❌ Erro ao registrar devolução');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }

        function fecharModalEmprestimo() {
            document.getElementById('modalEmprestimo').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
