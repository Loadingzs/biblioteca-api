<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Livros | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-header h2 {
            color: #1a3c34;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        .btn-primary:hover {
            background: #1a3c34;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.3rem;
        }
        
        .btn-delete {
            background: #e63946;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        
        .search-bar input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .search-bar button {
            background: #1a3c34;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-content h3 {
            margin-bottom: 1rem;
            color: #1a3c34;
        }
        
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .modal-buttons button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-save {
            background: #2d6a4f;
            color: white;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html" style="background: rgba(255,255,255,0.2);">Livros</a>
            <a href="usuarios.html">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>📖 Gerenciamento de Livros</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Livro</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaLivro" placeholder="Buscar por título, autor ou ISBN..." onkeyup="filtrarLivros()">
            <button onclick="filtrarLivros()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaLivros">
                    <!-- Dados preenchidos pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
    
    <!-- MODAL -->
    <div id="modalLivro" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">📖 Novo Livro</h3>
            <input type="hidden" id="livroId">
            <input type="text" id="titulo" placeholder="Título *">
            <input type="text" id="autor" placeholder="Autor *">
            <input type="text" id="isbn" placeholder="ISBN *">
            <select id="status">
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarLivro()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        let livros = [];
        let editandoId = null;
        const API_URL = '/api';

        async function carregarLivros() {
            try {
                const response = await fetch(`${API_URL}/livros`);
                livros = await response.json();
                renderizarTabelaLivros();
            } catch (error) {
                console.error('Erro ao carregar livros:', error);
                alert('❌ Erro ao conectar com o servidor.');
            }
        }

        function renderizarTabelaLivros() {
            const tbody = document.getElementById('tabelaLivros');
            tbody.innerHTML = '';
            
            livros.forEach(livro => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${livro.id}</td>
                    <td>${livro.titulo}</td>
                    <td>${livro.autor}</td>
                    <td>${livro.isbn}</td>
                    <td>${livro.disponivel ? '✅ Disponível' : '❌ Indisponível'}</td>
                    <td>
                        <button class="btn-edit" onclick="editarLivro(${livro.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarLivro(${livro.id})">🗑️</button>
                    </td>
                `;
            });
        }

        function filtrarLivros() {
            const busca = document.getElementById('buscaLivro').value.toLowerCase();
            const tbody = document.getElementById('tabelaLivros');
            tbody.innerHTML = '';
            
            const filtrados = livros.filter(livro => 
                livro.titulo.toLowerCase().includes(busca) ||
                livro.autor.toLowerCase().includes(busca) ||
                livro.isbn.includes(busca)
            );
            
            filtrados.forEach(livro => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${livro.id}</td>
                    <td>${livro.titulo}</td>
                    <td>${livro.autor}</td>
                    <td>${livro.isbn}</td>
                    <td>${livro.disponivel ? '✅ Disponível' : '❌ Indisponível'}</td>
                    <td>
                        <button class="btn-edit" onclick="editarLivro(${livro.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarLivro(${livro.id})">🗑️</button>
                    </td>
                `;
            });
        }

        function abrirModalCadastro() {
            editandoId = null;
            document.getElementById('modalTitulo').innerText = '📖 Novo Livro';
            document.getElementById('livroId').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('autor').value = '';
            document.getElementById('isbn').value = '';
            document.getElementById('status').value = 'disponivel';
            document.getElementById('modalLivro').style.display = 'flex';
        }

        function editarLivro(id) {
            const livro = livros.find(l => l.id === id);
            if (livro) {
                editandoId = id;
                document.getElementById('modalTitulo').innerText = '✏️ Editar Livro';
                document.getElementById('livroId').value = livro.id;
                document.getElementById('titulo').value = livro.titulo;
                document.getElementById('autor').value = livro.autor;
                document.getElementById('isbn').value = livro.isbn;
                document.getElementById('status').value = livro.disponivel ? 'disponivel' : 'indisponivel';
                document.getElementById('modalLivro').style.display = 'flex';
            }
        }

        async function salvarLivro() {
            const titulo = document.getElementById('titulo').value;
            const autor = document.getElementById('autor').value;
            const isbn = document.getElementById('isbn').value;
            const status = document.getElementById('status').value;

            if (!titulo || !autor || !isbn) {
                alert('❌ Preencha todos os campos!');
                return;
            }

            const livro = {
                titulo: titulo,
                autor: autor,
                isbn: isbn,
                disponivel: status === 'disponivel'
            };

            try {
                let response;
                if (editandoId) {
                    response = await fetch(`${API_URL}/livros/${editandoId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(livro)
                    });
                } else {
                    response = await fetch(`${API_URL}/livros`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(livro)
                    });
                }

                if (response.ok) {
                    alert(editandoId ? '✅ Livro atualizado!' : '✅ Livro cadastrado!');
                    fecharModal();
                    carregarLivros();
                } else {
                    alert('❌ Erro ao salvar livro');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro de conexão');
            }
        }

        async function deletarLivro(id) {
            if (confirm('⚠️ Tem certeza?')) {
                try {
                    const response = await fetch(`${API_URL}/livros/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('✅ Livro excluído!');
                        carregarLivros();
                    } else {
                        alert('❌ Erro ao excluir');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }

        function fecharModal() {
            document.getElementById('modalLivro').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', carregarLivros);
    </script>
</body>
</html>
