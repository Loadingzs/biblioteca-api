<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Livros | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-header h2 {
            color: #1a3c34;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        .btn-primary:hover {
            background: #1a3c34;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.3rem;
        }
        
        .btn-delete {
            background: #e63946;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        
        .search-bar input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        
        .search-bar button {
            background: #1a3c34;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-content h3 {
            margin-bottom: 1rem;
            color: #1a3c34;
        }
        
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .modal-buttons button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-save {
            background: #2d6a4f;
            color: white;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        /* Paginação */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pagination-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .pagination-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #2d6a4f;
            color: white;
            border-color: #2d6a4f;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html" style="background: rgba(255,255,255,0.2);">Livros</a>
            <a href="usuarios.html">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>📖 Gerenciamento de Livros</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Livro</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaLivro" placeholder="Buscar por título, autor ou ISBN..." onkeyup="filtrarLivros()">
            <button onclick="filtrarLivros()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 0.75rem; text-align: left;">ID</th>
                        <th style="padding: 0.75rem; text-align: left;">Título</th>
                        <th style="padding: 0.75rem; text-align: left;">Autor</th>
                        <th style="padding: 0.75rem; text-align: left;">ISBN</th>
                        <th style="padding: 0.75rem; text-align: left;">Status</th>
                        <th style="padding: 0.75rem; text-align: left;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaLivros">
                    <tr><td colspan="6" style="text-align: center;">Carregando livros...</td></tr>
                </tbody>
            </table>
            
            <!-- PAGINAÇÃO -->
            <div class="pagination-container" id="paginationContainer">
                <div class="pagination-info" id="paginationInfo">
                    Mostrando 0 de 0 registros
                </div>
                <div class="pagination-controls">
                    <button class="pagination-btn" id="btnAnterior" onclick="paginaAnterior()">◀ Anterior</button>
                    <span id="paginaAtual">Página 1</span>
                    <button class="pagination-btn" id="btnProximo" onclick="paginaProxima()">Próximo ▶</button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- MODAL DE CADASTRO/EDIÇÃO -->
    <div id="modalLivro" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">📖 Novo Livro</h3>
            <input type="hidden" id="livroId">
            <input type="text" id="titulo" placeholder="Título *">
            <input type="text" id="autor" placeholder="Autor *">
            <input type="text" id="isbn" placeholder="ISBN *">
            <select id="status">
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarLivro()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        let livros = [];
        let livrosFiltrados = [];
        let editandoId = null;
        
        // PAGINAÇÃO
        let paginaAtual = 1;
        let itensPorPagina = 5;
        let totalPaginas = 1;

        function atualizarPaginacao() {
            totalPaginas = Math.ceil(livrosFiltrados.length / itensPorPagina);
            if (totalPaginas === 0) totalPaginas = 1;
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            
            document.getElementById('paginacaoInfo').innerHTML = `Mostrando ${Math.min(itensPorPagina, livrosFiltrados.length)} de ${livrosFiltrados.length} registros`;
            document.getElementById('paginaAtual').innerHTML = `Página ${paginaAtual} de ${totalPaginas}`;
            
            document.getElementById('btnAnterior').disabled = (paginaAtual <= 1);
            document.getElementById('btnProximo').disabled = (paginaAtual >= totalPaginas);
        }

        function paginaAnterior() {
            if (paginaAtual > 1) {
                paginaAtual--;
                renderizarTabelaLivros();
            }
        }

        function paginaProxima() {
            if (paginaAtual < totalPaginas) {
                paginaAtual++;
                renderizarTabelaLivros();
            }
        }

        // ===== CARREGAR LIVROS =====
        async function carregarLivros() {
            try {
                const response = await fetch(`${API_URL}/livros`);
                if (!response.ok) throw new Error('Erro ao carregar livros');
                livros = await response.json();
                livrosFiltrados = [...livros];
                paginaAtual = 1;
                renderizarTabelaLivros();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('tabelaLivros').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">❌ Erro ao conectar com o servidor</td></tr>';
            }
        }

        // ===== RENDERIZAR TABELA COM PAGINAÇÃO =====
        function renderizarTabelaLivros() {
            const tbody = document.getElementById('tabelaLivros');
            tbody.innerHTML = '';
            
            atualizarPaginacao();
            
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const livrosPagina = livrosFiltrados.slice(inicio, fim);
            
            if (livrosPagina.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhum livro encontrado</td></tr>';
                return;
            }
            
            livrosPagina.forEach(livro => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${livro.id}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${livro.titulo}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${livro.autor}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${livro.isbn}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${livro.disponivel ? '✅ Disponível' : '❌ Indisponível'}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">
                        <button class="btn-edit" onclick="editarLivro(${livro.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarLivro(${livro.id})">🗑️</button>
                    </td>
                `;
            });
        }

        // ===== FILTRAR LIVROS =====
        function filtrarLivros() {
            const busca = document.getElementById('buscaLivro').value.toLowerCase();
            
            if (busca === '') {
                livrosFiltrados = [...livros];
            } else {
                livrosFiltrados = livros.filter(livro => 
                    livro.titulo.toLowerCase().includes(busca) ||
                    livro.autor.toLowerCase().includes(busca) ||
                    livro.isbn.includes(busca)
                );
            }
            
            paginaAtual = 1;
            renderizarTabelaLivros();
        }

        // ===== ABRIR MODAL =====
        function abrirModalCadastro() {
            editandoId = null;
            document.getElementById('modalTitulo').innerText = '📖 Novo Livro';
            document.getElementById('livroId').value = '';
            document.getElementById('titulo').value = '';
            document.getElementById('autor').value = '';
            document.getElementById('isbn').value = '';
            document.getElementById('status').value = 'disponivel';
            document.getElementById('modalLivro').style.display = 'flex';
        }

        // ===== EDITAR LIVRO =====
        function editarLivro(id) {
            const livro = livros.find(l => l.id === id);
            if (livro) {
                editandoId = id;
                document.getElementById('modalTitulo').innerText = '✏️ Editar Livro';
                document.getElementById('livroId').value = livro.id;
                document.getElementById('titulo').value = livro.titulo;
                document.getElementById('autor').value = livro.autor;
                document.getElementById('isbn').value = livro.isbn;
                document.getElementById('status').value = livro.disponivel ? 'disponivel' : 'indisponivel';
                document.getElementById('modalLivro').style.display = 'flex';
            }
        }

        // ===== SALVAR LIVRO =====
        async function salvarLivro() {
            const titulo = document.getElementById('titulo').value.trim();
            const autor = document.getElementById('autor').value.trim();
            const isbn = document.getElementById('isbn').value.trim();
            const status = document.getElementById('status').value;

            if (!titulo) {
                alert('❌ O campo Título é obrigatório!');
                document.getElementById('titulo').focus();
                return;
            }
            
            if (!autor) {
                alert('❌ O campo Autor é obrigatório!');
                document.getElementById('autor').focus();
                return;
            }
            
            if (!isbn) {
                alert('❌ O campo ISBN é obrigatório!');
                document.getElementById('isbn').focus();
                return;
            }

            const livro = {
                titulo: titulo,
                autor: autor,
                isbn: isbn,
                disponivel: status === 'disponivel'
            };

            try {
                let response;
                if (editandoId) {
                    response = await fetch(`${API_URL}/livros/${editandoId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(livro)
                    });
                } else {
                    response = await fetch(`${API_URL}/livros`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(livro)
                    });
                }

                if (response.ok) {
                    alert(editandoId ? '✅ Livro atualizado!' : '✅ Livro cadastrado!');
                    fecharModal();
                    carregarLivros();
                } else {
                    alert('❌ Erro ao salvar livro');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro de conexão');
            }
        }

        // ===== DELETAR LIVRO =====
        async function deletarLivro(id) {
            if (confirm('⚠️ Tem certeza que deseja excluir este livro?')) {
                try {
                    const response = await fetch(`${API_URL}/livros/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('✅ Livro excluído!');
                        carregarLivros();
                    } else {
                        alert('❌ Erro ao excluir');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }

        // ===== FECHAR MODAL =====
        function fecharModal() {
            document.getElementById('modalLivro').style.display = 'none';
        }

        // ===== INICIALIZAR =====
        document.addEventListener('DOMContentLoaded', () => {
            carregarLivros();
            
            window.onclick = function(event) {
                const modal = document.getElementById('modalLivro');
                if (event.target === modal) {
                    fecharModal();
                }
            };
        });
    </script>
</body>
</html>
