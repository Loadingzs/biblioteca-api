<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Livros | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <!-- Transição entre páginas -->
    <div id="pageTransition" class="page-transition">
        <div class="transition-spinner"></div>
    </div>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html" style="background: rgba(255,255,255,0.2);">Livros</a>
            <a href="usuarios.html">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>📖 Gerenciamento de Livros</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Livro</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaLivro" placeholder="Buscar por título, autor ou ISBN...">
            <button onclick="filtrarLivros()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 0.75rem; text-align: left;">ID</th>
                        <th style="padding: 0.75rem; text-align: left;">Título</th>
                        <th style="padding: 0.75rem; text-align: left;">Autor</th>
                        <th style="padding: 0.75rem; text-align: left;">ISBN</th>
                        <th style="padding: 0.75rem; text-align: left;">Status</th>
                        <th style="padding: 0.75rem; text-align: left;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaLivros">
                    <tr><td colspan="6" class="table-loading"><div class="spinner-small"></div><br>Carregando livros...</td></tr>
                </tbody>
            </table>
            
            <div class="pagination-container" id="paginationContainer">
                <div class="pagination-info" id="paginationInfo">Mostrando 0 de 0 registros</div>
                <div class="pagination-controls">
                    <button class="pagination-btn" id="btnAnterior" onclick="paginaAnterior()">◀ Anterior</button>
                    <span id="paginaAtual">Página 1</span>
                    <button class="pagination-btn" id="btnProximo" onclick="paginaProxima()">Próximo ▶</button>
                </div>
            </div>
        </div>
    </main>
    
    <div id="modalLivro" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">📖 Novo Livro</h3>
            <input type="hidden" id="livroId">
            <input type="text" id="titulo" placeholder="Título *">
            <input type="text" id="autor" placeholder="Autor *">
            <input type="text" id="isbn" placeholder="ISBN *">
            <select id="status">
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarLivro()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        const livrosContainer = {
            tabela: document.getElementById('tabelaLivros'),
            busca: document.getElementById('buscaLivro'),
            modal: document.getElementById('modalLivro'),
            modalTitulo: document.getElementById('modalTitulo'),
            livroId: document.getElementById('livroId'),
            titulo: document.getElementById('titulo'),
            autor: document.getElementById('autor'),
            isbn: document.getElementById('isbn'),
            status: document.getElementById('status'),
            paginationInfo: document.getElementById('paginationInfo'),
            paginaAtualEl: document.getElementById('paginaAtual'),
            btnAnterior: document.getElementById('btnAnterior'),
            btnProximo: document.getElementById('btnProximo')
        };

        let livros = [];
        let livrosFiltrados = [];
        let editandoId = null;
        let paginaAtual = 1;
        const itensPorPagina = 5;

        function atualizarPaginacao() {
            const totalPaginas = Math.max(1, Math.ceil(livrosFiltrados.length / itensPorPagina));
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            const exibidos = Math.min(itensPorPagina, livrosFiltrados.length);
            if (livrosContainer.paginationInfo) livrosContainer.paginationInfo.textContent = `Mostrando ${exibidos} de ${livrosFiltrados.length} registros`;
            if (livrosContainer.paginaAtualEl) livrosContainer.paginaAtualEl.textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            if (livrosContainer.btnAnterior) livrosContainer.btnAnterior.disabled = paginaAtual <= 1;
            if (livrosContainer.btnProximo) livrosContainer.btnProximo.disabled = paginaAtual >= totalPaginas;
            return totalPaginas;
        }

        function paginaAnterior() { if (paginaAtual > 1) { paginaAtual--; renderizarTabelaLivros(); } }
        function paginaProxima() { const total = Math.max(1, Math.ceil(livrosFiltrados.length / itensPorPagina)); if (paginaAtual < total) { paginaAtual++; renderizarTabelaLivros(); } }

        async function carregarLivros() {
            if (!livrosContainer.tabela) return;
            livrosContainer.tabela.innerHTML = '<tr><td colspan="6" class="table-loading"><div class="spinner-small"></div><br>Carregando livros...</td></tr>';
            try {
                const response = await fetch(`${API_URL}/livros`);
                if (!response.ok) throw new Error('Erro ao carregar livros');
                livros = await response.json();
                livrosFiltrados = [...livros];
                paginaAtual = 1;
                renderizarTabelaLivros();
            } catch (error) {
                livrosContainer.tabela.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">❌ Erro ao conectar</td></tr>';
                console.error(error);
            }
        }

        function renderizarTabelaLivros() {
            if (!livrosContainer.tabela) return;
            livrosContainer.tabela.innerHTML = '';
            atualizarPaginacao();
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const pagina = livrosFiltrados.slice(inicio, inicio + itensPorPagina);
            if (pagina.length === 0) { livrosContainer.tabela.innerHTML = '<tr><td colspan="6">Nenhum livro encontrado</td></tr>'; return; }

            const frag = document.createDocumentFragment();
            pagina.forEach(livro => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 0.75rem;">${livro.id}</td>
                    <td style="padding: 0.75rem;">${livro.titulo}</td>
                    <td style="padding: 0.75rem;">${livro.autor}</td>
                    <td style="padding: 0.75rem;">${livro.isbn}</td>
                    <td style="padding: 0.75rem;">${livro.disponivel ? '✅ Disponível' : '❌ Indisponível'}</td>
                    <td style="padding: 0.75rem;">
                        <button class="btn-edit" type="button" onclick="editarLivro(${livro.id})">✏️</button>
                        <button class="btn-delete" type="button" onclick="deletarLivro(${livro.id})">🗑️</button>
                    </td>`;
                frag.appendChild(tr);
            });
            livrosContainer.tabela.appendChild(frag);
        }

        function filtrarLivros() {
            const busca = (livrosContainer.busca?.value || '').trim().toLowerCase();
            livrosFiltrados = busca ? livros.filter(l => l.titulo.toLowerCase().includes(busca) || l.autor.toLowerCase().includes(busca) || l.isbn.includes(busca)) : [...livros];
            paginaAtual = 1;
            renderizarTabelaLivros();
        }

        function abrirModalCadastro() {
            editandoId = null;
            if (!livrosContainer.modal) return;
            livrosContainer.modalTitulo.textContent = '📖 Novo Livro';
            livrosContainer.livroId.value = '';
            livrosContainer.titulo.value = '';
            livrosContainer.autor.value = '';
            livrosContainer.isbn.value = '';
            livrosContainer.status.value = 'disponivel';
            livrosContainer.modal.style.display = 'flex';
        }

        function editarLivro(id) {
            const livro = livros.find(l => l.id === id);
            if (!livro || !livrosContainer.modal) return;
            editandoId = id;
            livrosContainer.modalTitulo.textContent = '✏️ Editar Livro';
            livrosContainer.livroId.value = livro.id;
            livrosContainer.titulo.value = livro.titulo;
            livrosContainer.autor.value = livro.autor;
            livrosContainer.isbn.value = livro.isbn;
            livrosContainer.status.value = livro.disponivel ? 'disponivel' : 'indisponivel';
            livrosContainer.modal.style.display = 'flex';
        }

        function fecharModal() { if (livrosContainer.modal) livrosContainer.modal.style.display = 'none'; }

        async function salvarLivro() {
            const titulo = livrosContainer.titulo.value.trim();
            const autor = livrosContainer.autor.value.trim();
            const isbn = livrosContainer.isbn.value.trim();
            const status = livrosContainer.status.value;
            if (!titulo || !autor || !isbn) { showToast('error', null, '❌ Preencha todos os campos!'); return; }
            const livro = { titulo, autor, isbn, disponivel: status === 'disponivel' };
            try {
                const url = editandoId ? `${API_URL}/livros/${editandoId}` : `${API_URL}/livros`;
                const method = editandoId ? 'PUT' : 'POST';
                const response = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(livro) });
                if (!response.ok) throw new Error('Erro ao salvar');
                showToast('success', null, editandoId ? '✅ Livro atualizado!' : '✅ Livro cadastrado!');
                fecharModal();
                carregarLivros();
            } catch (error) { showToast('error', null, '❌ Erro de conexão'); console.error(error); }
        }

        async function deletarLivro(id) {
            if (!(await showConfirm('⚠️ Tem certeza?'))) return;
            try {
                const response = await fetch(`${API_URL}/livros/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Erro ao excluir');
                showToast('success', null, '✅ Livro excluído!');
                carregarLivros();
            } catch (error) { showToast('error', null, '❌ Erro de conexão'); console.error(error); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            initTheme();
            carregarLivros();
            if (livrosContainer.busca) livrosContainer.busca.addEventListener('keyup', filtrarLivros);
            window.addEventListener('click', e => { if (e.target === livrosContainer.modal) fecharModal(); });
        });
    </script>
</body>
</html>
