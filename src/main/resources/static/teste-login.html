<!DOCTYPE html>
<html>
<head>
    <title>Teste Login</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>🔐 Teste de Login - Biblioteca Web</h2>
    <button onclick="testarLogin()">Login como Admin</button>
    <button onclick="testarLoginInvalido()">Teste Login Inválido</button>
    <div id="resultado"></div>

    <script>
        const resultado = document.getElementById('resultado');

        async function testarLogin() {
            resultado.innerHTML = '<div class="loading">Carregando...</div>';
            
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': application/json' },
                    body: JSON.stringify({
                        email: 'admin@biblioteca.com',
                        senha: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    resultado.innerHTML = `
                        <div class="success">
                            ✅ <strong>Login realizado com sucesso!</strong><br><br>
                            📧 Email: ${data.email}<br>
                            👑 Role: ${data.role}<br><br>
                            🔑 Token JWT:<br>
                            <pre style="font-size: 11px; word-wrap: break-word;">${data.token}</pre>
                        </div>
                    `;
                    localStorage.setItem('token', data.token);
                } else {
                    resultado.innerHTML = `<div class="error">❌ Erro: ${data.message || 'Credenciais inválidas'}</div>`;
                }
            } catch (error) {
                resultado.innerHTML = `<div class="error">❌ Erro de conexão: ${error.message}</div>`;
            }
        }

        async function testarLoginInvalido() {
            resultado.innerHTML = '<div class="loading">Carregando...</div>';
            
            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'invalido@email.com',
                        senha: 'senhaerrada'
                    })
                });
                
                const data = await response.json();
                resultado.innerHTML = `<div class="error">❌ Esperado: Credenciais inválidas<br>Resposta: ${JSON.stringify(data)}</div>`;
            } catch (error) {
                resultado.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
