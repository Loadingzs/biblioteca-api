<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-header h2 {
            color: #1a3c34;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.3rem;
        }
        
        .btn-delete {
            background: #e63946;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        
        .search-bar input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-content input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .btn-save {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html">Livros</a>
            <a href="usuarios.html" style="background: rgba(255,255,255,0.2);">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>👥 Gerenciamento de Usuários</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Usuário</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaUsuario" placeholder="Buscar por nome ou email..." onkeyup="filtrarUsuarios()">
            <button onclick="filtrarUsuarios()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <!-- Dados preenchidos pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>
    
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">👤 Novo Usuário</h3>
            <input type="hidden" id="usuarioId">
            <input type="text" id="nome" placeholder="Nome completo *">
            <input type="email" id="email" placeholder="E-mail *">
            <input type="text" id="telefone" placeholder="Telefone *">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarUsuario()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        let usuarios = [];
        let editandoUsuarioId = null;
        const API_URL = '/api';

        async function carregarUsuarios() {
            try {
                const response = await fetch(`${API_URL}/usuarios`);
                usuarios = await response.json();
                renderizarTabelaUsuarios();
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro ao conectar com o servidor.');
            }
        }

        function renderizarTabelaUsuarios() {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            
            usuarios.forEach(usuario => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${usuario.id}</td>
                    <td>${usuario.nome}</td>
                    <td>${usuario.email}</td>
                    <td>${usuario.telefone}</td>
                    <td>
                        <button class="btn-edit" onclick="editarUsuario(${usuario.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarUsuario(${usuario.id})">🗑️</button>
                    </td>
                `;
            });
        }

        function filtrarUsuarios() {
            const busca = document.getElementById('buscaUsuario').value.toLowerCase();
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            
            const filtrados = usuarios.filter(u => 
                u.nome.toLowerCase().includes(busca) || u.email.toLowerCase().includes(busca)
            );
            
            filtrados.forEach(usuario => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${usuario.id}</td>
                    <td>${usuario.nome}</td>
                    <td>${usuario.email}</td>
                    <td>${usuario.telefone}</td>
                    <td>
                        <button class="btn-edit" onclick="editarUsuario(${usuario.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarUsuario(${usuario.id})">🗑️</button>
                    </td>
                `;
            });
        }

        function abrirModalCadastro() {
            editandoUsuarioId = null;
            document.getElementById('modalTitulo').innerText = '👤 Novo Usuário';
            document.getElementById('usuarioId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('email').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('modalUsuario').style.display = 'flex';
        }

        function editarUsuario(id) {
            const usuario = usuarios.find(u => u.id === id);
            if (usuario) {
                editandoUsuarioId = id;
                document.getElementById('modalTitulo').innerText = '✏️ Editar Usuário';
                document.getElementById('usuarioId').value = usuario.id;
                document.getElementById('nome').value = usuario.nome;
                document.getElementById('email').value = usuario.email;
                document.getElementById('telefone').value = usuario.telefone;
                document.getElementById('modalUsuario').style.display = 'flex';
            }
        }

        async function salvarUsuario() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const telefone = document.getElementById('telefone').value;

            if (!nome || !email || !telefone) {
                alert('❌ Preencha todos os campos!');
                return;
            }

            const usuario = { nome, email, telefone };

            try {
                let response;
                if (editandoUsuarioId) {
                    response = await fetch(`${API_URL}/usuarios/${editandoUsuarioId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(usuario)
                    });
                } else {
                    response = await fetch(`${API_URL}/usuarios`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(usuario)
                    });
                }

                if (response.ok) {
                    alert(editandoUsuarioId ? '✅ Usuário atualizado!' : '✅ Usuário cadastrado!');
                    fecharModal();
                    carregarUsuarios();
                } else {
                    alert('❌ Erro ao salvar usuário');
                }
            } catch (error) {
                alert('❌ Erro de conexão');
            }
        }

        async function deletarUsuario(id) {
            if (confirm('⚠️ Tem certeza?')) {
                try {
                    const response = await fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('✅ Usuário excluído!');
                        carregarUsuarios();
                    } else {
                        alert('❌ Erro ao excluir');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }

        function fecharModal() {
            document.getElementById('modalUsuario').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', carregarUsuarios);
    </script>
</body>
</html>
