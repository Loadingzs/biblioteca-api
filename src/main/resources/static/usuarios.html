<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .page-header h2 { color: #1a3c34; }
        .btn-primary { background: #2d6a4f; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 8px; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #333; border: none; padding: 0.3rem 0.8rem; border-radius: 5px; cursor: pointer; margin-right: 0.3rem; }
        .btn-delete { background: #e63946; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 5px; cursor: pointer; }
        .search-bar { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
        .search-bar input { flex: 1; padding: 0.7rem; border: 1px solid #ddd; border-radius: 8px; }
        .search-bar button { background: #1a3c34; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 8px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 20px; padding: 2rem; width: 90%; max-width: 500px; }
        .modal-content input { width: 100%; padding: 0.7rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: flex-end; }
        .btn-save { background: #2d6a4f; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; }
        .btn-cancel { background: #6c757d; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; }
        .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 8px; flex-wrap: wrap; gap: 1rem; }
        .pagination-controls { display: flex; gap: 0.5rem; align-items: center; }
        .pagination-btn { background: white; border: 1px solid #ddd; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; }
        .pagination-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .table-loading { text-align: center; padding: 2rem; color: #666; }
        .spinner-small { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #2d6a4f; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html">Livros</a>
            <a href="usuarios.html" style="background: rgba(255,255,255,0.2);">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>👥 Gerenciamento de Usuários</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Usuário</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaUsuario" placeholder="Buscar por nome ou email...">
            <button onclick="filtrarUsuarios()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table style="width: 100%; border-collapse: collapse;">
                <thead><tr style="background: #f8f9fa;"><th>ID</th><th>Nome</th><th>Email</th><th>Telefone</th><th>Ações</th></tr></thead>
                <tbody id="tabelaUsuarios"><tr><td colspan="5" class="table-loading"><div class="spinner-small"></div><br>Carregando usuários...</td></tr</tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info" id="paginationInfo">Mostrando 0 de 0 registros</div>
                <div class="pagination-controls">
                    <button class="pagination-btn" id="btnAnterior" onclick="paginaAnterior()">◀ Anterior</button>
                    <span id="paginaAtual">Página 1</span>
                    <button class="pagination-btn" id="btnProximo" onclick="paginaProxima()">Próximo ▶</button>
                </div>
            </div>
        </div>
    </main>
    
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">👤 Novo Usuário</h3>
            <input type="hidden" id="usuarioId">
            <input type="text" id="nome" placeholder="Nome completo *">
            <input type="email" id="email" placeholder="E-mail *">
            <input type="text" id="telefone" placeholder="Telefone *">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarUsuario()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer"><p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p></footer>
    
    <script src="js/scripts.js"></script>
    <script>
        // NÃO DECLARAR API_URL AQUI
        let usuarios = [];
        let usuariosFiltrados = [];
        let editandoUsuarioId = null;
        let paginaAtual = 1;
        let itensPorPagina = 5;
        let totalPaginas = 1;

        function atualizarPaginacao() {
            totalPaginas = Math.ceil(usuariosFiltrados.length / itensPorPagina);
            if (totalPaginas === 0) totalPaginas = 1;
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            document.getElementById('paginationInfo').innerHTML = `Mostrando ${Math.min(itensPorPagina, usuariosFiltrados.length)} de ${usuariosFiltrados.length} registros`;
            document.getElementById('paginaAtual').innerHTML = `Página ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('btnAnterior').disabled = (paginaAtual <= 1);
            document.getElementById('btnProximo').disabled = (paginaAtual >= totalPaginas);
        }

        function paginaAnterior() { if (paginaAtual > 1) { paginaAtual--; renderizarTabelaUsuarios(); } }
        function paginaProxima() { if (paginaAtual < totalPaginas) { paginaAtual++; renderizarTabelaUsuarios(); } }

        async function carregarUsuarios() {
            try {
                const response = await fetch(`${API_URL}/usuarios`);
                if (!response.ok) throw new Error('Erro');
                usuarios = await response.json();
                usuariosFiltrados = [...usuarios];
                paginaAtual = 1;
                renderizarTabelaUsuarios();
            } catch (error) {
                document.getElementById('tabelaUsuarios').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">❌ Erro ao conectar</td></tr';
            }
        }

        function renderizarTabelaUsuarios() {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            atualizarPaginacao();
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const usuariosPagina = usuariosFiltrados.slice(inicio, inicio + itensPorPagina);
            if (usuariosPagina.length === 0) { tbody.innerHTML = '<tr><td colspan="5">Nenhum usuário encontrado</td></tr'; return; }
            usuariosPagina.forEach(u => {
                const row = tbody.insertRow();
                row.innerHTML = `<td>${u.id}</td><td>${u.nome}</td><td>${u.email}</td><td>${u.telefone}</td>
                    <td><button class="btn-edit" onclick="editarUsuario(${u.id})">✏️</button>
                    <button class="btn-delete" onclick="deletarUsuario(${u.id})">🗑️</button></td>`;
            });
        }

        function filtrarUsuarios() {
            const busca = document.getElementById('buscaUsuario').value.toLowerCase();
            usuariosFiltrados = busca === '' ? [...usuarios] : usuarios.filter(u => u.nome.toLowerCase().includes(busca) || u.email.toLowerCase().includes(busca));
            paginaAtual = 1;
            renderizarTabelaUsuarios();
        }

        function abrirModalCadastro() { editandoUsuarioId = null; document.getElementById('modalTitulo').innerText = '👤 Novo Usuário'; document.getElementById('usuarioId').value = ''; document.getElementById('nome').value = ''; document.getElementById('email').value = ''; document.getElementById('telefone').value = ''; document.getElementById('modalUsuario').style.display = 'flex'; }
        function editarUsuario(id) { const u = usuarios.find(x => x.id === id); if (u) { editandoUsuarioId = id; document.getElementById('modalTitulo').innerText = '✏️ Editar Usuário'; document.getElementById('usuarioId').value = u.id; document.getElementById('nome').value = u.nome; document.getElementById('email').value = u.email; document.getElementById('telefone').value = u.telefone; document.getElementById('modalUsuario').style.display = 'flex'; } }
        function fecharModal() { document.getElementById('modalUsuario').style.display = 'none'; }

        async function salvarUsuario() {
            const nome = document.getElementById('nome').value.trim(), email = document.getElementById('email').value.trim(), telefone = document.getElementById('telefone').value.trim();
            if (!nome || !email || !telefone) { alert('❌ Preencha todos os campos!'); return; }
            const usuario = { nome, email, telefone };
            try {
                let response;
                if (editandoUsuarioId) response = await fetch(`${API_URL}/usuarios/${editandoUsuarioId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(usuario) });
                else response = await fetch(`${API_URL}/usuarios`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(usuario) });
                if (response.ok) { alert(editandoUsuarioId ? '✅ Usuário atualizado!' : '✅ Usuário cadastrado!'); fecharModal(); carregarUsuarios(); } else alert('❌ Erro ao salvar');
            } catch (error) { alert('❌ Erro de conexão'); }
        }

        async function deletarUsuario(id) {
            if (confirm('⚠️ Tem certeza?')) {
                try { const response = await fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' }); if (response.ok) { alert('✅ Usuário excluído!'); carregarUsuarios(); } else alert('❌ Erro ao excluir'); } catch (error) { alert('❌ Erro de conexão'); }
            }
        }

        carregarUsuarios();
        document.getElementById('buscaUsuario').addEventListener('keyup', filtrarUsuarios);
    </script>
</body>
</html>
