<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .page-header h2 {
            color: #1a3c34;
        }
        
        .btn-primary {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary:hover {
            background: #1a3c34;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.3rem;
        }
        
        .btn-delete {
            background: #e63946;
            color: white;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .search-bar {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        
        .search-bar input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .search-bar button {
            background: #1a3c34;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
        }
        
        .modal-content input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .btn-save {
            background: #2d6a4f;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Paginação */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pagination-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .pagination-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination-btn:hover:not(:disabled) {
            background: #2d6a4f;
            color: white;
            border-color: #2d6a4f;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="livros.html">Livros</a>
            <a href="usuarios.html" style="background: rgba(255,255,255,0.2);">Usuários</a>
            <a href="emprestimos.html">Empréstimos</a>
            <a href="relatorios.html">Relatórios</a>
        </nav>
        <div class="user-info">
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>👥 Gerenciamento de Usuários</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Usuário</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaUsuario" placeholder="Buscar por nome ou email..." onkeyup="filtrarUsuarios()">
            <button onclick="filtrarUsuarios()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f8f9fa;">
                        <th style="padding: 0.75rem; text-align: left;">ID</th>
                        <th style="padding: 0.75rem; text-align: left;">Nome</th>
                        <th style="padding: 0.75rem; text-align: left;">Email</th>
                        <th style="padding: 0.75rem; text-align: left;">Telefone</th>
                        <th style="padding: 0.75rem; text-align: left;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr><td colspan="5" style="text-align: center;">Carregando usuários...</td></tr>
                </tbody>
            </table>
            
            <!-- PAGINAÇÃO -->
            <div class="pagination-container" id="paginationContainer">
                <div class="pagination-info" id="paginationInfo">
                    Mostrando 0 de 0 registros
                </div>
                <div class="pagination-controls">
                    <button class="pagination-btn" id="btnAnterior" onclick="paginaAnterior()">◀ Anterior</button>
                    <span id="paginaAtual">Página 1</span>
                    <button class="pagination-btn" id="btnProximo" onclick="paginaProxima()">Próximo ▶</button>
                </div>
            </div>
        </div>
    </main>
    
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">👤 Novo Usuário</h3>
            <input type="hidden" id="usuarioId">
            <input type="text" id="nome" placeholder="Nome completo *">
            <input type="email" id="email" placeholder="E-mail *">
            <input type="text" id="telefone" placeholder="Telefone *">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarUsuario()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p>
    </footer>
    
    <script src="js/scripts.js"></script>
    <script>
        let usuarios = [];
        let usuariosFiltrados = [];
        let editandoUsuarioId = null;
        
        // PAGINAÇÃO
        let paginaAtual = 1;
        let itensPorPagina = 5;
        let totalPaginas = 1;

        function atualizarPaginacao() {
            totalPaginas = Math.ceil(usuariosFiltrados.length / itensPorPagina);
            if (totalPaginas === 0) totalPaginas = 1;
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            
            document.getElementById('paginationInfo').innerHTML = `Mostrando ${Math.min(itensPorPagina, usuariosFiltrados.length)} de ${usuariosFiltrados.length} registros`;
            document.getElementById('paginaAtual').innerHTML = `Página ${paginaAtual} de ${totalPaginas}`;
            
            document.getElementById('btnAnterior').disabled = (paginaAtual <= 1);
            document.getElementById('btnProximo').disabled = (paginaAtual >= totalPaginas);
        }

        function paginaAnterior() {
            if (paginaAtual > 1) {
                paginaAtual--;
                renderizarTabelaUsuarios();
            }
        }

        function paginaProxima() {
            if (paginaAtual < totalPaginas) {
                paginaAtual++;
                renderizarTabelaUsuarios();
            }
        }

        // ===== CARREGAR USUÁRIOS =====
        async function carregarUsuarios() {
            try {
                const response = await fetch(`${API_URL}/usuarios`);
                if (!response.ok) throw new Error('Erro ao carregar usuários');
                usuarios = await response.json();
                usuariosFiltrados = [...usuarios];
                paginaAtual = 1;
                renderizarTabelaUsuarios();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('tabelaUsuarios').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">❌ Erro ao conectar com o servidor</td></tr>';
            }
        }

        // ===== RENDERIZAR TABELA COM PAGINAÇÃO =====
        function renderizarTabelaUsuarios() {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            
            atualizarPaginacao();
            
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const usuariosPagina = usuariosFiltrados.slice(inicio, fim);
            
            if (usuariosPagina.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum usuário encontrado</td></tr>';
                return;
            }
            
            usuariosPagina.forEach(usuario => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${usuario.id}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${usuario.nome}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${usuario.email}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">${usuario.telefone}</td>
                    <td style="padding: 0.75rem; border-bottom: 1px solid #ddd;">
                        <button class="btn-edit" onclick="editarUsuario(${usuario.id})">✏️</button>
                        <button class="btn-delete" onclick="deletarUsuario(${usuario.id})">🗑️</button>
                    </td>
                `;
            });
        }

        // ===== FILTRAR USUÁRIOS =====
        function filtrarUsuarios() {
            const busca = document.getElementById('buscaUsuario').value.toLowerCase();
            
            if (busca === '') {
                usuariosFiltrados = [...usuarios];
            } else {
                usuariosFiltrados = usuarios.filter(usuario => 
                    usuario.nome.toLowerCase().includes(busca) ||
                    usuario.email.toLowerCase().includes(busca)
                );
            }
            
            paginaAtual = 1;
            renderizarTabelaUsuarios();
        }

        // ===== ABRIR MODAL =====
        function abrirModalCadastro() {
            editandoUsuarioId = null;
            document.getElementById('modalTitulo').innerText = '👤 Novo Usuário';
            document.getElementById('usuarioId').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('email').value = '';
            document.getElementById('telefone').value = '';
            document.getElementById('modalUsuario').style.display = 'flex';
        }

        // ===== EDITAR USUÁRIO =====
        function editarUsuario(id) {
            const usuario = usuarios.find(u => u.id === id);
            if (usuario) {
                editandoUsuarioId = id;
                document.getElementById('modalTitulo').innerText = '✏️ Editar Usuário';
                document.getElementById('usuarioId').value = usuario.id;
                document.getElementById('nome').value = usuario.nome;
                document.getElementById('email').value = usuario.email;
                document.getElementById('telefone').value = usuario.telefone;
                document.getElementById('modalUsuario').style.display = 'flex';
            }
        }

        // ===== SALVAR USUÁRIO =====
        async function salvarUsuario() {
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();

            if (!nome) {
                alert('❌ O campo Nome é obrigatório!');
                document.getElementById('nome').focus();
                return;
            }
            
            if (!email) {
                alert('❌ O campo E-mail é obrigatório!');
                document.getElementById('email').focus();
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('❌ E-mail inválido! Use o formato: nome@dominio.com');
                document.getElementById('email').focus();
                return;
            }
            
            if (!telefone) {
                alert('❌ O campo Telefone é obrigatório!');
                document.getElementById('telefone').focus();
                return;
            }

            const usuario = { nome, email, telefone };

            try {
                let response;
                if (editandoUsuarioId) {
                    response = await fetch(`${API_URL}/usuarios/${editandoUsuarioId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(usuario)
                    });
                } else {
                    response = await fetch(`${API_URL}/usuarios`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(usuario)
                    });
                }

                if (response.ok) {
                    alert(editandoUsuarioId ? '✅ Usuário atualizado!' : '✅ Usuário cadastrado!');
                    fecharModal();
                    carregarUsuarios();
                } else {
                    alert('❌ Erro ao salvar usuário');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('❌ Erro de conexão');
            }
        }

        // ===== DELETAR USUÁRIO =====
        async function deletarUsuario(id) {
            if (confirm('⚠️ Tem certeza que deseja excluir este usuário?')) {
                try {
                    const response = await fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('✅ Usuário excluído!');
                        carregarUsuarios();
                    } else {
                        alert('❌ Erro ao excluir usuário');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }

        // ===== FECHAR MODAL =====
        function fecharModal() {
            document.getElementById('modalUsuario').style.display = 'none';
        }

        // ===== INICIALIZAR =====
        document.addEventListener('DOMContentLoaded', () => {
            carregarUsuarios();
            
            window.onclick = function(event) {
                const modal = document.getElementById('modalUsuario');
                if (event.target === modal) {
                    fecharModal();
                }
            };
        });
    </script>
</body>
</html>
