<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários | Biblioteca Web</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="pageTransition" class="page-transition"><div class="transition-spinner"></div></div>

    <header class="header">
        <div class="logo">📚 <span>Biblioteca</span> Web</div>
        <nav class="nav">
            <a href="javascript:void(0);" onclick="navegarPara('index.html')">Dashboard</a>
            <a href="javascript:void(0);" onclick="navegarPara('livros.html')">Livros</a>
            <a href="javascript:void(0);" onclick="navegarPara('usuarios.html')" style="background: rgba(255,255,255,0.2);">Usuários</a>
            <a href="javascript:void(0);" onclick="navegarPara('emprestimos.html')">Empréstimos</a>
            <a href="javascript:void(0);" onclick="navegarPara('relatorios.html')">Relatórios</a>
        </nav>
        <div class="user-info">
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
            <span>👤 Admin</span>
            <button class="btn-sair" onclick="sair()">Sair</button>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h2>👥 Gerenciamento de Usuários</h2>
            <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Usuário</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="buscaUsuario" placeholder="Buscar por nome ou email...">
            <button onclick="filtrarUsuarios()">🔍 Buscar</button>
        </div>
        
        <div class="tabela-container">
            <table style="width: 100%; border-collapse: collapse;">
                <thead><tr style="background: #f8f9fa;"><th style="padding: 0.75rem;">ID</th><th style="padding: 0.75rem;">Nome</th><th style="padding: 0.75rem;">Email</th><th style="padding: 0.75rem;">Telefone</th><th style="padding: 0.75rem;">Ações</th></tr></thead>
                <tbody id="tabelaUsuarios">
                    <tr>
                        <td colspan="5" class="table-loading"><div class="spinner-small"></div><br>Carregando usuários...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <div class="pagination-info" id="paginationInfo">Mostrando 0 de 0 registros</div>
                <div class="pagination-controls">
                    <button class="pagination-btn" id="btnAnterior" onclick="paginaAnterior()">◀ Anterior</button>
                    <span id="paginaAtual">Página 1</span>
                    <button class="pagination-btn" id="btnProximo" onclick="paginaProxima()">Próximo ▶</button>
                </div>
            </div>
        </div>
    </main>
    
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">👤 Novo Usuário</h3>
            <input type="hidden" id="usuarioId">
            <input type="text" id="nome" placeholder="Nome completo *">
            <input type="email" id="email" placeholder="E-mail *">
            <input type="text" id="telefone" placeholder="Telefone *">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarUsuario()">Salvar</button>
            </div>
        </div>
    </div>
    
    <footer class="footer"><p>&copy; <span id="anoAtual">2026</span> Sistema de Biblioteca Web - Todos os direitos reservados</p></footer>
    
    <script src="js/scripts.js"></script>
    <script>
        const usuariosContainer = {
            tabela: document.getElementById('tabelaUsuarios'),
            busca: document.getElementById('buscaUsuario'),
            modal: document.getElementById('modalUsuario'),
            modalTitulo: document.getElementById('modalTitulo'),
            usuarioId: document.getElementById('usuarioId'),
            nome: document.getElementById('nome'),
            email: document.getElementById('email'),
            telefone: document.getElementById('telefone'),
            paginationInfo: document.getElementById('paginationInfo'),
            paginaAtual: document.getElementById('paginaAtual'),
            btnAnterior: document.getElementById('btnAnterior'),
            btnProximo: document.getElementById('btnProximo'),
            anoAtual: document.getElementById('anoAtual')
        };

        let usuarios = [];
        let usuariosFiltrados = [];
        let editandoUsuarioId = null;
        let paginaAtual = 1;
        const itensPorPagina = 5;

        function atualizarPaginacao() {
            const totalPaginas = Math.max(1, Math.ceil(usuariosFiltrados.length / itensPorPagina));
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            const exibidos = Math.min(itensPorPagina, usuariosFiltrados.length);
            usuariosContainer.paginationInfo.textContent = `Mostrando ${exibidos} de ${usuariosFiltrados.length} registros`;
            usuariosContainer.paginaAtual.textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            usuariosContainer.btnAnterior.disabled = paginaAtual <= 1;
            usuariosContainer.btnProximo.disabled = paginaAtual >= totalPaginas;
            return totalPaginas;
        }

        function paginaAnterior() {
            if (paginaAtual > 1) {
                paginaAtual -= 1;
                renderizarTabelaUsuarios();
            }
        }

        function paginaProxima() {
            const totalPaginas = Math.max(1, Math.ceil(usuariosFiltrados.length / itensPorPagina));
            if (paginaAtual < totalPaginas) {
                paginaAtual += 1;
                renderizarTabelaUsuarios();
            }
        }

        function renderizarTabelaUsuarios() {
            if (!usuariosContainer.tabela) return;
            usuariosContainer.tabela.innerHTML = '';
            atualizarPaginacao();
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const paginados = usuariosFiltrados.slice(inicio, inicio + itensPorPagina);

            if (paginados.length === 0) {
                usuariosContainer.tabela.innerHTML = '<tr><td colspan="5">Nenhum usuário encontrado</td></tr>';
                return;
            }

            const fragment = document.createDocumentFragment();
            paginados.forEach(u => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.nome}</td>
                    <td>${u.email}</td>
                    <td>${u.telefone}</td>
                    <td>
                        <button class="btn-edit" type="button" onclick="editarUsuario(${u.id})">✏️</button>
                        <button class="btn-delete" type="button" onclick="deletarUsuario(${u.id})">🗑️</button>
                    </td>`;
                fragment.appendChild(row);
            });

            usuariosContainer.tabela.appendChild(fragment);
        }

        async function carregarUsuarios() {
            if (!usuariosContainer.tabela) return;
            usuariosContainer.tabela.innerHTML = '<tr><td colspan="5" class="table-loading"><div class="spinner-small"></div><br>Carregando usuários...</td></tr>';
            try {
                const res = await fetch(`${API_URL}/usuarios`);
                usuarios = await res.json();
                usuariosFiltrados = [...usuarios];
                paginaAtual = 1;
                renderizarTabelaUsuarios();
            } catch (e) {
                usuariosContainer.tabela.innerHTML = '<tr><td colspan="5" style="color:red;">❌ Erro ao carregar usuários</td></tr>';
                console.error(e);
            }
        }

        function filtrarUsuarios() {
            if (!usuariosContainer.busca) return;
            const busca = usuariosContainer.busca.value.trim().toLowerCase();
            usuariosFiltrados = busca ? usuarios.filter(u => u.nome.toLowerCase().includes(busca) || u.email.toLowerCase().includes(busca)) : [...usuarios];
            paginaAtual = 1;
            renderizarTabelaUsuarios();
        }

        function abrirModalCadastro() {
            editandoUsuarioId = null;
            if (!usuariosContainer.modal) return;
            usuariosContainer.modalTitulo.textContent = '👤 Novo Usuário';
            usuariosContainer.usuarioId.value = '';
            usuariosContainer.nome.value = '';
            usuariosContainer.email.value = '';
            usuariosContainer.telefone.value = '';
            usuariosContainer.modal.style.display = 'flex';
        }

        function editarUsuario(id) {
            const usuario = usuarios.find(u => u.id === id);
            if (!usuario || !usuariosContainer.modal) return;
            editandoUsuarioId = id;
            usuariosContainer.modalTitulo.textContent = '✏️ Editar Usuário';
            usuariosContainer.usuarioId.value = usuario.id;
            usuariosContainer.nome.value = usuario.nome;
            usuariosContainer.email.value = usuario.email;
            usuariosContainer.telefone.value = usuario.telefone;
            usuariosContainer.modal.style.display = 'flex';
        }

        function fecharModal() {
            if (usuariosContainer.modal) usuariosContainer.modal.style.display = 'none';
        }

        async function salvarUsuario() {
            const nome = usuariosContainer.nome.value.trim();
            const email = usuariosContainer.email.value.trim();
            const telefone = usuariosContainer.telefone.value.trim();

            if (!nome || !email || !telefone) {
                showToast('error', null, '❌ Preencha todos os campos!');
                return;
            }

            const usuario = { nome, email, telefone };
            const url = editandoUsuarioId ? `${API_URL}/usuarios/${editandoUsuarioId}` : `${API_URL}/usuarios`;
            const method = editandoUsuarioId ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(usuario)
                });

                if (!res.ok) throw new Error('Erro ao salvar');

                showToast('success', null, editandoUsuarioId ? '✅ Usuário atualizado!' : '✅ Usuário cadastrado!');
                fecharModal();
                carregarUsuarios();
            } catch (e) {
                showToast('error', null, '❌ Erro de conexão');
                console.error(e);
            }
        }

        async function deletarUsuario(id) {
            if (!(await showConfirm('⚠️ Tem certeza?'))) return;
            try {
                const res = await fetch(`${API_URL}/usuarios/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Erro ao excluir');
                showToast('success', null, '✅ Usuário excluído!');
                carregarUsuarios();
            } catch (e) {
                showToast('error', null, '❌ Erro de conexão');
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            initTheme();
            carregarUsuarios();
            if (usuariosContainer.busca) {
                usuariosContainer.busca.addEventListener('keyup', filtrarUsuarios);
            }
            if (usuariosContainer.anoAtual) {
                usuariosContainer.anoAtual.textContent = new Date().getFullYear();
            }
            window.addEventListener('click', event => {
                if (event.target === usuariosContainer.modal) fecharModal();
            });
        });
    </script>
</body>
</html>
